<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1811" />
      <stop offset="100%" stop-color="#1b4332" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52b788" />
      <stop offset="100%" stop-color="#2d6a4f" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle with glowing emerald border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#34d399" stroke-width="2.5" stroke-opacity="0.6" />

  <!-- Agricultural Produce Leaf -->
  <path d="M32 12 C32 12 44 14 44 26 C44 34 36 38 32 40 C28 38 20 34 20 26 C20 14 32 12 32 12 Z" fill="url(#leafGrad)" />
  <path d="M32 15 L32 38" stroke="#74c69d" stroke-width="2" stroke-linecap="round" />

  <!-- Dynamic Heartbeat / Spoilage Pulse Wave -->
  <path d="M8 42 L22 42 L26 32 L32 50 L38 36 L42 42 L56 42" fill="none" stroke="url(#pulseGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Glowing Pulse Center Node -->
  <circle cx="32" cy="50" r="3.5" fill="#fbbf24" />
  <circle cx="32" cy="50" r="6" fill="#fbbf24" opacity="0.3" />
</svg>
